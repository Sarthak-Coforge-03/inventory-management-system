[project]
name = "inventory-management-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sarthak-Coforge-03", email = "sarthak.kakkar@coforge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ruff>=0.17.3",
]

[project.scripts]
inventory-management-system = "inventory_management_system:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
